<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>养老 App 演示（浏览器版）</title>
<style>
  :root{
    --ink:#22303c; --line:#e3e9ee; --soft:#f4f7f9; --bg:#dfe9ee;
    --card:#fff; --muted:#6b7a88;
    --primary:#1f7a8c; --primary-deep:#165e6d; --primary-soft:#e7f3f5;
    --warn:#d9483b; --warn-soft:#fbeceb; --ok:#2e9e63; --ok-soft:#e9f6ef;
    --shadow:0 2px 14px rgba(31,56,76,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,-apple-system,sans-serif;
    background:linear-gradient(160deg,#d7e6ec 0%,#e8eef1 100%);color:var(--ink);min-height:100vh;}

  /* 顶部演示工具条 */
  .topbar{display:flex;align-items:center;gap:14px;padding:16px 24px;flex-wrap:wrap;}
  .topbar h1{font-size:18px;font-weight:700;color:var(--primary-deep);letter-spacing:.5px;}
  .seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:13px;overflow:hidden;box-shadow:var(--shadow);}
  .seg button{border:none;background:transparent;padding:9px 20px;font-size:14px;cursor:pointer;color:var(--muted);transition:background .2s,color .2s;}
  .seg button + button{border-left:1px solid var(--line);}
  .seg button.active{background:var(--primary);color:#fff;font-weight:600;}
  .who{font-size:13px;color:var(--muted);margin-left:auto;}

  /* 手机壳 */
  .stage{display:flex;justify-content:center;padding:18px 16px 34px;}
  .phone{position:relative;width:400px;max-width:100%;height:800px;background:#f3f6f8;border:1px solid #cfd9df;border-radius:40px;overflow:hidden;
    display:flex;flex-direction:column;box-shadow:0 24px 50px rgba(31,56,76,.22);}
  .status{height:30px;display:flex;justify-content:space-between;align-items:center;padding:0 22px;font-size:12px;color:var(--ink);}
  .status-icons{display:flex;align-items:center;gap:7px;}
  .sig{display:flex;align-items:flex-end;gap:2px;}
  .sig i{width:3px;background:var(--ink);border-radius:1px;}
  .sig i:nth-child(1){height:4px;}
  .sig i:nth-child(2){height:6px;}
  .sig i:nth-child(3){height:8px;}
  .sig i:nth-child(4){height:10px;}
  .wifi{font-size:13px;line-height:1;}
  .batt{display:flex;align-items:center;gap:4px;}
  .batt-shell{position:relative;width:22px;height:11px;border:1.2px solid var(--ink);border-radius:3px;padding:1.5px;}
  .batt-shell::after{content:"";position:absolute;right:-3.5px;top:3px;width:2px;height:5px;background:var(--ink);border-radius:0 1px 1px 0;}
  .batt-level{display:block;height:100%;width:82%;background:var(--ok);border-radius:1.5px;}
  .batt-text{font-size:11px;color:var(--ink);}
  .appbar{height:54px;display:flex;align-items:center;padding:0 18px;border-bottom:1px solid var(--line);background:#fff;}
  .appbar .title{font-size:18px;font-weight:700;}
  .appbar .back{cursor:pointer;font-size:22px;margin-right:10px;color:var(--primary);visibility:hidden;}
  .screen{flex:1;overflow-y:auto;padding:16px;}
  .screen::-webkit-scrollbar{width:5px;}
  .screen::-webkit-scrollbar-thumb{background:#c6d2d9;border-radius:5px;}

  /* 卡片 */
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:14px;box-shadow:var(--shadow);}
  .card h3{font-size:16px;margin-bottom:12px;font-weight:700;}
  .row{display:flex;align-items:center;gap:10px;}
  .between{justify-content:space-between;}
  .muted{color:var(--muted);font-size:13px;line-height:1.5;}

  /* 九宫格入口 */
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .gitem{display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;}
  .gitem .ic{width:60px;height:60px;border:none;border-radius:19px;background:var(--primary-soft);color:var(--primary-deep);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;transition:transform .15s,background .2s;}
  .gitem:hover .ic{transform:translateY(-2px);}
  .gitem span{font-size:12.5px;color:var(--ink);}

  /* 按钮 */
  .btn{display:block;width:100%;padding:14px;border:1px solid var(--line);border-radius:14px;background:#fff;font-size:16px;font-weight:600;cursor:pointer;text-align:center;color:var(--ink);transition:transform .12s,box-shadow .2s,background .2s;}
  .btn:active{transform:scale(.98);}
  .btn.primary{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-deep) 100%);color:#fff;border-color:transparent;box-shadow:0 6px 16px rgba(31,122,140,.28);}
  .btn.warn{background:var(--warn-soft);border-color:#f3c2bd;color:var(--warn);}
  .btn.sm{width:auto;padding:8px 14px;font-size:13px;border-radius:11px;}

  /* 表单 */
  .field{margin-bottom:12px;}
  .field label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px;}
  .field input,.field select{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:15px;background:var(--soft);color:var(--ink);outline:none;transition:border-color .2s,box-shadow .2s;}
  .field input:focus,.field select:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 3px rgba(31,122,140,.14);}

  /* 标签 */
  .tag{display:inline-block;border:1px solid var(--line);background:var(--soft);border-radius:9px;padding:3px 10px;font-size:12px;color:var(--muted);}
  .tag.red{border-color:#f3c2bd;background:var(--warn-soft);color:var(--warn);}
  .tag.ok{border-color:#bfe6cf;background:var(--ok-soft);color:var(--ok);}

  /* 列表项 */
  .list-card{display:flex;gap:12px;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;cursor:pointer;background:#fff;box-shadow:0 1px 6px rgba(31,56,76,.05);transition:transform .15s,box-shadow .2s;}
  .list-card:hover{transform:translateY(-1px);box-shadow:var(--shadow);}
  .list-card .info{flex:1;min-width:0;}
  .list-card .t{font-size:15px;font-weight:600;margin-bottom:5px;}
  .list-card .arrow{font-size:22px;color:#b9c6cd;align-self:center;}

  /* 登录 */
  .login-logo{width:88px;height:88px;border-radius:26px;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;
    font-size:15px;font-weight:700;color:var(--primary-deep);background:var(--primary-soft);box-shadow:inset 0 0 0 1.5px #cfe6ea;}

  /* SOS 大圆 */
  .sos-big{width:210px;height:210px;border:3px solid var(--warn);color:var(--warn);border-radius:50%;margin:24px auto;
    display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;cursor:pointer;background:radial-gradient(circle at 50% 35%,#fff 0%,var(--warn-soft) 100%);
    box-shadow:0 0 0 10px rgba(217,72,59,.08),0 14px 30px rgba(217,72,59,.22);transition:transform .15s;}
  .sos-big:active{transform:scale(.97);}
  .sos-big .b{font-size:24px;}

  /* 底部导航 */
  .tabbar{height:68px;border-top:1px solid var(--line);display:flex;align-items:flex-end;background:#fff;padding-bottom:8px;}
  .tabbar .tab{flex:1;text-align:center;font-size:12px;color:var(--muted);cursor:pointer;padding:6px 0;}
  .tabbar .tab .ti{font-size:20px;display:block;margin-bottom:4px;}
  .tabbar .tab.active{color:var(--primary);font-weight:700;}
  .tabbar .center{flex:1;display:flex;justify-content:center;align-items:flex-end;}
  .sos-btn{width:64px;height:64px;border:none;color:#fff;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:-26px;background:linear-gradient(135deg,#e8604f 0%,var(--warn) 100%);box-shadow:0 10px 20px rgba(217,72,59,.35);cursor:pointer;}
  .sos-btn .ti{font-size:18px;}
  .tab .ti{position:relative;display:inline-block;}

  /* 未读角标 */
  .badge{position:absolute;top:-7px;right:-13px;background:var(--warn);color:#fff;border-radius:10px;min-width:18px;height:18px;font-size:10.5px;line-height:18px;padding:0 5px;box-shadow:0 2px 6px rgba(217,72,59,.4);}

  /* 时间线 */
  .timeline{padding-left:20px;position:relative;}
  .timeline::before{content:"";position:absolute;left:5px;top:4px;bottom:4px;width:2px;background:var(--line);border-radius:2px;}
  .tl{position:relative;margin-bottom:18px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 14px 14px 18px;box-shadow:var(--shadow);}
  .tl::before{content:"";position:absolute;left:-20px;top:18px;width:11px;height:11px;border:2px solid var(--primary);border-radius:50%;background:#fff;}

  /* 提示与占位 */
  .toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:12px;font-size:14px;opacity:0;transition:opacity .25s;z-index:99;box-shadow:0 10px 26px rgba(0,0,0,.25);}
  .toast.show{opacity:1;}
  .placeholder{color:var(--muted);font-size:13px;text-align:center;padding:20px;}

  /* AI 助手悬浮球 */
  .ai-ball{position:absolute;right:18px;bottom:88px;width:56px;height:56px;border-radius:50%;
    background:linear-gradient(135deg,var(--primary) 0%,var(--primary-deep) 100%);color:#fff;
    display:none;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;
    box-shadow:0 10px 22px rgba(31,122,140,.35);z-index:30;}
  .ai-ball:active{transform:scale(.95);}

  /* AI 对话面板 */
  .ai-panel{position:absolute;inset:0;background:#f3f6f8;display:none;flex-direction:column;z-index:40;}
  .ai-head{height:54px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;
    background:#fff;border-bottom:1px solid var(--line);}
  .ai-title{font-size:16px;font-weight:700;}
  .ai-close{border:none;background:var(--soft);color:var(--muted);width:34px;height:34px;border-radius:10px;
    font-size:15px;cursor:pointer;}
  .ai-msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
  .ai-msgs::-webkit-scrollbar{width:5px;}
  .ai-msgs::-webkit-scrollbar-thumb{background:#c6d2d9;border-radius:5px;}
  .ai-msg{max-width:78%;padding:11px 13px;border-radius:15px;font-size:14px;line-height:1.55;}
  .ai-msg.ai{background:#fff;border:1px solid var(--line);border-top-left-radius:5px;align-self:flex-start;
    box-shadow:0 1px 6px rgba(31,56,76,.05);}
  .ai-msg.me{background:var(--primary);color:#fff;border-top-right-radius:5px;align-self:flex-end;}
  .ai-input{display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:#fff;}
  .ai-input input{flex:1;height:44px;border:1px solid var(--line);border-radius:12px;padding:0 14px;font-size:15px;
    background:var(--soft);outline:none;}
  .ai-input input:focus{border-color:var(--primary);background:#fff;}
  .ai-send{width:76px;height:44px;border:none;border-radius:12px;background:var(--primary);color:#fff;
    font-size:15px;font-weight:600;cursor:pointer;}
</style>
</head>
<body>
  <div class="topbar">
    <h1>养老 App · 浏览器演示</h1>
    <div class="seg" id="endSeg">
      <button data-end="elder">老人端</button>
      <button data-end="family">子女端</button>
    </div>
    <span class="who" id="who">未登录</span>
  </div>

  <div class="stage">
    <div class="phone">
      <div class="status">
        <span id="statusClock" class="clock">--:--</span>
        <span class="status-icons">
          <span class="sig"><i></i><i></i><i></i><i></i></span>
          <span class="wifi">📶</span>
          <span class="batt"><span class="batt-shell"><span class="batt-level"></span></span><span class="batt-text">82%</span></span>
        </span>
      </div>
      <div class="appbar"><span class="back" id="backBtn">‹</span><span class="title" id="appTitle"></span></div>
      <div class="screen" id="screen"></div>
      <div class="tabbar" id="tabbar"></div>
      <div class="ai-ball" id="aiBall" data-action="open-ai" title="AI 助手">AI</div>
      <div class="ai-panel" id="aiPanel">
        <div class="ai-head">
          <span class="ai-title">🤖 AI 智能助手</span>
          <button class="ai-close" data-action="close-ai">✕</button>
        </div>
        <div class="ai-msgs" id="aiMsgs"></div>
        <div class="ai-input">
          <input id="aiInput" placeholder="请输入您的问题…" autocomplete="off">
          <button class="ai-send" data-action="send-ai">发送</button>
        </div>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const DEMO = {
  elder:  { phone: "13300000001", role: "elder",  label: "老人端" },
  family: { phone: "13300000002", role: "family", label: "子女端" },
};
const VIT_LABEL = { bp:"血压", glucose:"血糖", heart_rate:"心率", weight:"体重" };
const ORDER_STATUS = { pending_pay:"待付款", in_progress:"进行中", completed:"已完成", after_sale:"售后" };
const ALERT_LABEL = { SOS:"SOS 求助", vitals_abnormal:"体征异常", missed_med:"漏服药", geofence:"离开围栏", idle:"长时间无活动" };
const ALERT_STATUS = { unread:"未读", read:"已读", contacted:"已联系" };
const MED_STATUS = { taken:"已服", untaken:"未服", missed:"漏服" };
const SERVICE_ITEMS = ["助洁服务","助浴服务","陪诊服务","代购代办","上门理发","康复护理","送餐服务"];

let state = { end:"elder", uid:null, role:null, tab:"home", detailElder:null, vitalType:null, authed:false, loginEnd:"elder", resCat:"", famBrowse:false, unreadMsgs:0, unreadAlerts:0, aiOpen:false, aiVisible: localStorage.getItem("ec_ai_ball") !== "0", aiMessages: [] };
let ws = null;

// ---------- 接口封装 ----------
async function api(path, method="GET", body=null, includeUid=true){
  const headers = { "Content-Type":"application/json" };
  if (includeUid && state.uid) headers["X-User-Id"] = state.uid;
  const opt = { method, headers };
  if (body) opt.body = JSON.stringify(body);
  const res = await fetch(path, opt);
  const json = await res.json();
  if (json.code !== 0) throw new Error(json.message || "请求失败");
  return json.data;
}

function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), 1800);
}

// 状态栏时间：跟随系统时间实时刷新
function updateClock(){
  const el = document.getElementById("statusClock");
  if (!el) return;
  const now = new Date();
  const hh = String(now.getHours()).padStart(2,"0");
  const mm = String(now.getMinutes()).padStart(2,"0");
  el.textContent = `${hh}:${mm}`;
}

// ---------- 登录与连接 ----------
async function doLogin(phone, code, end){
  const d = DEMO[end];
  const u = await api("/api/auth/login", "POST", { phone, role:d.role, code }, false);
  state.uid = u.user_id; state.role = u.role; state.end = end; state.loginEnd = end;
  state.authed = true; state.tab = "home"; state.detailElder = null;
  localStorage.setItem("ec_user", JSON.stringify({ end, uid:u.user_id }));
  document.getElementById("who").textContent = `${d.label} · ${u.phone}`;
}

function logout(){
  state.authed = false; state.uid = null; state.role = null;
  state.aiOpen = false;
  localStorage.removeItem("ec_user");
  document.getElementById("who").textContent = "未登录";
  render();
}

function connectWS(){
  if (ws) { try{ws.close();}catch(e){} }
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(`${proto}://${location.host}/ws?user_id=${state.uid}`);
  ws.onmessage = (ev)=>{
    const m = JSON.parse(ev.data);
    toast(m.type === "alert_new" ? "收到新告警" : "数据已更新");
    refreshCurrent();
  };
}

// ---------- AI 助手（本地占位应答，后续可接入大模型接口） ----------
const AI_WELCOME = "您好，我是养老助手，可以帮您了解健康记录、用药提醒、上门服务和紧急求助等问题。";

function aiReply(text){
  const t = text || "";
  if (/(血压|血糖|心率|体重|体征|体温)/.test(t)) return "您可以在「健康」页查看和录入血压、血糖、心率、体重等体征；如指标异常，系统会自动提醒您的家属。";
  if (/(服药|吃药|用药|药品|剂量)/.test(t)) return "请按用药提醒按时服药，「健康」页可查看用药计划并标记已服；漏服时家属会收到提醒。";
  if (/(紧急|求助|sos|摔倒|跌倒|帮助)/i.test(t)) return "如遇紧急情况，请点击首页或底部中央的「SOS 一键求助」，系统会立即通知紧急联系人。";
  if (/(服务|上门|预约|助洁|助浴|陪诊|护理|送餐|理发)/.test(t)) return "您可以在「服务」页浏览居家上门、社区服务和养老机构项目，选择项目后预约下单即可。";
  if (/(你好|您好|在吗|hi|hello)/i.test(t)) return "您好，请问需要我帮您了解哪方面的内容？健康、用药、服务还是紧急求助？";
  return "这是演示版的本地应答，暂未接入在线大模型。您可以换个说法，或咨询健康、用药、服务、求助相关问题。";
}

function renderAiBall(){
  const ball = document.getElementById("aiBall");
  if (!ball) return;
  ball.style.display = (state.authed && state.aiVisible && !state.aiOpen) ? "flex" : "none";
}

function renderAiMsgs(){
  const box = document.getElementById("aiMsgs");
  if (!box) return;
  box.innerHTML = state.aiMessages.map(m=>`
    <div class="ai-msg ${m.role==="user"?"me":"ai"}">${m.text}</div>`).join("");
  box.scrollTop = box.scrollHeight;
}

function openAi(){
  state.aiOpen = true;
  if (!state.aiMessages.length) state.aiMessages.push({role:"ai", text:AI_WELCOME});
  document.getElementById("aiPanel").style.display = "flex";
  renderAiMsgs();
  renderAiBall();
  setTimeout(()=>{ const i=document.getElementById("aiInput"); if(i) i.focus(); }, 60);
}

function closeAi(){
  state.aiOpen = false;
  document.getElementById("aiPanel").style.display = "none";
  renderAiBall();
}

function sendAi(){
  const input = document.getElementById("aiInput");
  const text = input.value.trim();
  if (!text) return;
  state.aiMessages.push({role:"user", text});
  input.value = "";
  state.aiMessages.push({role:"ai", text:aiReply(text)});
  renderAiMsgs();
}

// ---------- 导航与渲染 ----------
const ELDER_TABS = [
  { key:"home",    label:"首页", ti:"▦" },
  { key:"service", label:"服务", ti:"🛎" },
  { key:"sos",     center:true, label:"SOS", ti:"!" },
  { key:"health",  label:"健康", ti:"✚" },
  { key:"mine",    label:"我的", ti:"◉" },
];
const FAMILY_TABS = [
  { key:"home",   label:"父母", ti:"▦" },
  { key:"alert",  label:"告警", ti:"⚠" },
  { key:"order",  label:"代办", ti:"🛒" },
  { key:"mine",   label:"我的", ti:"◉" },
];

function badgeFor(key){
  if (state.end === "elder" && key === "home") return state.unreadMsgs;
  if (state.end === "family" && key === "alert") return state.unreadAlerts;
  return 0;
}

function renderTabbar(){
  const tabs = state.end === "elder" ? ELDER_TABS : FAMILY_TABS;
  document.getElementById("tabbar").innerHTML = tabs.map(t=>{
    if (t.center) {
      return `<div class="center"><div class="sos-btn" data-tab="sos"><span class="ti">!</span>SOS</div></div>`;
    }
    const n = badgeFor(t.key);
    const badge = n > 0 ? `<span class="badge">${n > 99 ? "99+" : n}</span>` : "";
    return `<div class="tab ${state.tab===t.key?'active':''}" data-tab="${t.key}">
       <span class="ti">${t.ti}${badge}</span>${t.label}</div>`;
  }).join("");
  document.getElementById("appTitle").textContent =
    state.end === "elder" ? "老人端" : "子女端";
}

async function refreshBadges(){
  if (!state.uid) return;
  try {
    if (state.end === "elder") {
      const r = await api("/api/messages/unread-count");
      state.unreadMsgs = r.count;
    } else {
      const r = await api("/api/family/alerts/unread-count");
      state.unreadAlerts = r.count;
    }
  } catch (e) { /* 角标计数失败不阻塞页面 */ }
}

async function render(){
  const screen = document.getElementById("screen");
  if (!state.authed) {
    document.getElementById("tabbar").innerHTML = "";
    document.getElementById("appTitle").textContent = "登录";
    document.getElementById("backBtn").style.visibility = "hidden";
    state.aiOpen = false;
    document.getElementById("aiPanel").style.display = "none";
    renderAiBall();
    renderLogin();
    return;
  }
  renderTabbar();
  await refreshBadges();
  renderTabbar();
  renderAiBall();
  screen.innerHTML = `<div class="placeholder">加载中…</div>`;
  try {

// ---------- 事件 ----------
document.addEventListener("click", async (e)=>{
  const tab = e.target.closest("[data-tab]");
  if (tab) { state.tab = tab.dataset.tab; state.detailElder = null; render(); return; }

  const seg = e.target.closest("#endSeg button");
  if (seg) { await switchEnd(seg.dataset.end); return; }

  const act = e.target.closest("[data-action]");
  if (!act) return;
  const a = act.dataset.action;
  try {
    if (a === "open-ai") { openAi(); return; }
    if (a === "close-ai") { closeAi(); return; }
    if (a === "send-ai") { sendAi(); return; }
    if (a === "voice") {
      toast(`「${act.dataset.field}」语音输入为首版占位，正式版接入语音转写`);
      return;
    }
    if (a === "pick-vital") {
      state.vitalType = act.dataset.vtype;
      await render();
      setTimeout(()=>{ const v=document.getElementById("vValue"); if(v) v.focus(); }, 60);
      return;
    }
    if (a === "pick-login-end") {
      state.loginEnd = act.dataset.end;
      render();
      return;
    }
    if (a === "pick-cat") {
      state.resCat = act.dataset.cat;
      render();
      return;
    }
    if (a === "browse-resources") {
      state.famBrowse = true;
      render();
      return;
    }
    if (a === "browse-back") {
      state.famBrowse = false;
      render();
      return;
    }
    if (a === "login") {
      const phone = document.getElementById("lPhone").value.trim();
      const code = document.getElementById("lCode").value.trim();
      const agree = document.getElementById("lAgree").checked;
      if (!agree) { toast("请先同意隐私政策与用户协议"); return; }
      if (!phone) { toast("请输入手机号"); return; }
      await doLogin(phone, code, state.loginEnd);
      connectWS();
      render();
      return;
    }
    if (a === "sos") {
      await api("/api/sos", "POST", { location:"家中", note:"需要帮助" });
      toast("已发起求助，已通知家属");
    }
    else if (a === "add-vital") {
      const type = document.getElementById("vType").value;
      const value = document.getElementById("vValue").value.trim();
      const source = document.getElementById("vSource").value;
      const device_type = source === "device" ? document.getElementById("vDevice").value : null;
      await api("/api/vitals", "POST", { type, value, unit:"", source, device_type });
      toast("体征已保存");
    }
    else if (a === "add-med") {
      const name = document.getElementById("mName").value.trim();
      const dosage = document.getElementById("mDosage").value.trim();
      if (!name) throw new Error("药品名称不能为空");
      const [dose, time] = dosage.split("·").map(s=>(s||"").trim());
      await api("/api/medications", "POST", { name, dosage:dose||"", time_rule:time||"" });
      toast("用药计划已添加");
    }
    else if (a === "mark-taken") {
      await api(`/api/medications/${act.dataset.plan}/taken`, "POST", { status:"taken" });
      toast("已标记服药");
    }
    else if (a === "order-self") {
      await api("/api/orders", "POST", {
        service_item: document.getElementById("oItem").value.trim(),
        amount: Number(document.getElementById("oAmount").value||0),
        appointment_time: document.getElementById("oTime").value.trim(),
        address: document.getElementById("oAddress").value.trim(),
      });
      toast("下单成功");
    }
    else if (a === "order-family") {
      await api("/api/family/orders", "POST", {
        elder_id: Number(document.getElementById("fElder").value),
        service_item: document.getElementById("fItem").value.trim(),
        amount: Number(document.getElementById("fAmount").value||0),
        appointment_time: document.getElementById("fTime").value.trim(),
      });
      toast("代付下单成功");
    }
    else if (a === "pay-order") {
      await api(`/api/family/orders/${act.dataset.id}/pay`, "POST");
      toast("支付成功");
    }
    else if (a === "read-alert") {
      await api(`/api/family/alerts/${act.dataset.id}/read`, "POST", { status: act.dataset.status });
    }
    else if (a === "read-message") {
      await api(`/api/messages/${act.dataset.id}/read`, "POST");
    }
    else if (a === "logout") {
      logout();
      return;
    }
    else if (a === "goto-detail") {
      state.detailElder = Number(act.dataset.elder); render(); return;
    }
    else if (a === "save-profile") {
      await api("/api/profile", "PUT", {
        name: document.getElementById("pName").value.trim(),
        age: Number(document.getElementById("pAge").value||0) || null,
        chronic_disease: document.getElementById("pChronic").value.trim(),
        allergy: document.getElementById("pAllergy").value.trim(),
        address: document.getElementById("pAddress").value.trim(),
      });
      toast("档案已保存");
    }
    else if (a === "save-settings") {
      await api("/api/settings", "PUT", {
        voice_broadcast: document.getElementById("setBroadcast").checked?1:0,
        high_contrast: document.getElementById("setContrast").checked?1:0,
        voice_input: document.getElementById("setVoiceInput").checked?1:0,
      });
      const aiBall = document.getElementById("setAiBall").checked;
      state.aiVisible = aiBall;
      localStorage.setItem("ec_ai_ball", aiBall ? "1" : "0");
      renderAiBall();
      toast("设置已保存");
    }
    else if (a === "save-sos-settings") {
      await api("/api/sos/settings", "PUT", {
        fall_detection: document.getElementById("sosFall").checked?1:0,
        geofence: document.getElementById("sosGeo").checked?1:0,
        idle_reminder: document.getElementById("sosIdle").checked?1:0,
      });
      toast("安全开关已保存");
    }
    render();
  } catch (err) { toast(err.message); }
});

document.getElementById("backBtn").addEventListener("click", ()=>{
  state.detailElder = null; state.famBrowse = false; render();
});

document.getElementById("aiInput").addEventListener("keydown", (e)=>{
  if (e.key === "Enter") sendAi();
});

async function switchEnd(end){
  state.tab = "home"; state.detailElder = null;
  await doLogin(DEMO[end].phone, "123456", end);
  connectWS(); render();
}

// 启动：先进入登录界面，不自动登录
(async function boot(){
  const saved = JSON.parse(localStorage.getItem("ec_user")||"null");
  state.loginEnd = saved?.end || "elder";
  state.end = state.loginEnd;
  updateClock();
  setInterval(updateClock, 1000);
  render();
})();
</script>
</body>
</html>
